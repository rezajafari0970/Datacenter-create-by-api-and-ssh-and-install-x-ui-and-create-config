name: Promote verified AWS cleanup and Kamatera candidate
on:
  push:
    branches: ['release-promote/aws-purge-kamatera-20261026']
permissions:
  contents: write
  actions: read
concurrency:
  group: verified-stable-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: github.repository == 'rezajafari0970/Datacenter-create-by-api-and-ssh-and-install-x-ui-and-create-config'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CANDIDATE: 992a67f4ec2e7f8e9d7eac067f5be916b3f9f165
      BASE: de0b276e3dea51142de8518a597d5d848b3219e3
      VERIFIED_RUN: '40357695600'
      SOURCE_REPO: rezajafari0970/Digital-ocean-bot
      SOURCE_SHA: 0f1e18d127b697d25f5011e16d00b68dff9b4524
      SOURCE_RUN: '40355188748'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 992a67f4ec2e7f8e9d7eac067f5be916b3f9f165
          fetch-depth: 0
      - name: Recheck exact candidate and independent installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];run=os.environ['VERIFIED_RUN'];candidate=os.environ['CANDIDATE']
          def get(path, repository=repo):
              request=urllib.request.Request('https://api.github.com/repos/'+repository+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=20) as response:return json.load(response)
          result=get('/actions/runs/'+run)
          assert result['head_sha']==candidate and result['status']=='completed' and result['conclusion']=='success'
          jobs=get('/actions/runs/'+run+'/jobs')['jobs']
          assert {'test','install'}.issubset({j['name'] for j in jobs if j['conclusion']=='success'})
          source=get('/actions/runs/'+os.environ['SOURCE_RUN'],os.environ['SOURCE_REPO'])
          assert source['head_sha']==os.environ['SOURCE_SHA'] and source['status']=='completed' and source['conclusion']=='success'
          source_jobs=get('/actions/runs/'+os.environ['SOURCE_RUN']+'/jobs',os.environ['SOURCE_REPO'])['jobs']
          assert any(j['name']=='fleet' and j['conclusion']=='success' for j in source_jobs)
          print('Exact candidate source and independent installation verified')
          PY
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          python3 release/check-source.py
          git merge-base --is-ancestor "$BASE" "$CANDIDATE"
      - name: Atomically promote main and stable with leases
        run: |
          python3 - <<'PY'
          import os,subprocess
          result=subprocess.check_output(['git','ls-remote','--heads','origin','refs/heads/main','refs/heads/stable'],text=True)
          actual={ref:sha for sha,ref in (line.split() for line in result.splitlines())}
          assert actual=={'refs/heads/main':os.environ['BASE'],'refs/heads/stable':os.environ['BASE']},'Destination changed; refusing promotion'
          PY
          git push --atomic --force-with-lease="refs/heads/main:$BASE" --force-with-lease="refs/heads/stable:$BASE" origin "$CANDIDATE:refs/heads/main" "$CANDIDATE:refs/heads/stable"
          python3 - <<'PY'
          import os,subprocess
          result=subprocess.check_output(['git','ls-remote','--heads','origin','refs/heads/main','refs/heads/stable'],text=True)
          actual={ref:sha for sha,ref in (line.split() for line in result.splitlines())}
          assert actual=={'refs/heads/main':os.environ['CANDIDATE'],'refs/heads/stable':os.environ['CANDIDATE']}
          print('Atomic main/stable promotion verified')
          PY
